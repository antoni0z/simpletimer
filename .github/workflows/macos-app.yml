name: Build macOS App

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build app bundle
        run: python -m PyInstaller --clean --noconfirm deep_work_timer.spec

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Deep Work Timer.app" "Deep Work Timer-macOS.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deep-Work-Timer-macOS
          path: Deep Work Timer-macOS.zip

      - name: Detect release tag
        id: release_tag
        shell: bash
        run: |
          tag=""
          while IFS= read -r candidate; do
            case "$candidate" in
              v*)
                tag="$candidate"
                break
                ;;
            esac
          done < <(git tag --points-at HEAD)

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Publish tagged release
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: Deep Work Timer-macOS.zip
          generate_release_notes: true
