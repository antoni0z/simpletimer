name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests

  build-macos:
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build app bundle
        run: python -m PyInstaller --clean --noconfirm deep_work_timer.spec

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Deep Work Timer.app" "Deep Work Timer-macOS.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deep-Work-Timer-macOS
          path: Deep Work Timer-macOS.zip

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Deep Work Timer-macOS.zip
          generate_release_notes: true
